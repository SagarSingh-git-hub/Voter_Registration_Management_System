{% extends "base.html" %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center relative">
    <div class="glass-panel p-8 md:p-12 rounded-3xl w-full max-w-md relative z-10 text-center tilt-card animate-slide-in" style="animation-delay: 0.1s;">
        
        <div class="w-20 h-20 mx-auto bg-gradient-to-br from-peacock to-electric rounded-full flex items-center justify-center shadow-glow mb-8 animate-pulse-slow">
            <i class="fas fa-lock text-white text-3xl"></i>
        </div>

        <h2 class="font-display text-3xl font-bold text-white mb-2 slide-in-bottom" style="animation-delay: 0.2s;">Set New Password</h2>
        <p class="text-gray-400 font-light mb-8 slide-in-bottom" style="animation-delay: 0.25s;">Enter and confirm your new password below.</p>
        
        <form method="POST" action="" class="space-y-5 text-left">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <!-- New Password -->
            <div class="group slide-in-bottom" style="animation-delay: 0.3s;">
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">New Password</label>
                <input
                    type="password"
                    name="new_password"
                    id="new_password"
                    required
                    minlength="8"
                    class="w-full bg-white/5 border border-white/10 rounded-xl text-white px-4 py-3 focus:outline-none focus:border-electric focus:bg-white/10 focus:shadow-glow transition-all placeholder-gray-600"
                    placeholder="Minimum 8 characters"
                >
            </div>

            <!-- Confirm Password -->
            <div class="group slide-in-bottom" style="animation-delay: 0.35s;">
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Confirm Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    id="confirm_password"
                    required
                    class="w-full bg-white/5 border border-white/10 rounded-xl text-white px-4 py-3 focus:outline-none focus:border-electric focus:bg-white/10 focus:shadow-glow transition-all placeholder-gray-600"
                    placeholder="Re-enter new password"
                >
                <p id="match-error" class="text-red-400 text-xs mt-1 hidden">Passwords do not match.</p>
            </div>

            <div class="pt-4 slide-in-bottom" style="animation-delay: 0.4s;">
                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-electric text-dark font-display font-bold text-lg py-4 rounded-xl hover:bg-white transition-all duration-300 shadow-glow transform hover:scale-[1.02] active:scale-[0.98] cursor-pointer"
                >
                    Update Password
                </button>
            </div>
        </form>

        <p class="mt-6 text-xs text-gray-500 slide-in-bottom" style="animation-delay: 0.5s;">
            Remembered it? <a href="{{ url_for('auth.login') }}" class="text-electric hover:text-white transition-colors">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Real-time password match validation
    const newPwd = document.getElementById('new_password');
    const confirmPwd = document.getElementById('confirm_password');
    const matchError = document.getElementById('match-error');
    const submitBtn = document.getElementById('submit-btn');

    function checkMatch() {
        if (confirmPwd.value && newPwd.value !== confirmPwd.value) {
            matchError.classList.remove('hidden');
            confirmPwd.classList.add('border-red-500');
        } else {
            matchError.classList.add('hidden');
            confirmPwd.classList.remove('border-red-500');
        }
    }

    confirmPwd.addEventListener('input', checkMatch);
    newPwd.addEventListener('input', checkMatch);

    // Anti double-click
    document.querySelector('form').addEventListener('submit', function(e) {
        if (newPwd.value !== confirmPwd.value) {
            e.preventDefault();
            checkMatch();
            return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating...';
    });
</script>
{% endblock %}
